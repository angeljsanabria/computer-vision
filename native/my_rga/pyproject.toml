[build-system]
requires = ["scikit-build-core>=0.9.0", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "my_rga"
version = "0.1.0"
description = "Rockchip RGA resize/letterbox/color helpers for RK3568"
requires-python = ">=3.8"

[tool.scikit-build]
wheel.packages = []
cmake.source-dir = "."
install.components = ["my_rga"]

[tool.scikit-build.cmake.define]
CMAKE_BUILD_TYPE = "Release"
